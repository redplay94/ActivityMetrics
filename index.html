<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActivityMetrics | Track. Measure. Improve.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; scroll-behavior: smooth; }
        .glass-card { background: rgba(23, 23, 23, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen">
    <nav class="flex justify-between items-center p-6 max-w-7xl mx-auto">
        <div class="text-2xl font-bold tracking-tighter text-orange-500">ActivityMetrics</div>
        <div class="space-x-8 text-sm font-medium text-gray-400">
            <a href="#" class="hover:text-white transition">Features</a>
            <a href="#" class="hover:text-white transition">Statistics</a>
            <a href="#" class="hover:text-white transition">Contact</a>
        </div>
    </nav>

    <header class="pt-20 pb-10 text-center px-4">
        <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight">Your personal digital hub for <span class="text-orange-500">training analysis.</span></h1>
        <p class="text-gray-400 text-lg max-w-2xl mx-auto mb-10">Track your activities throughout the day, plan your pace precisely, and see all your best results in one place.</p>
        
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="dashboard.html" class="bg-orange-600 hover:bg-orange-500 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg shadow-orange-900/20 transition-all transform hover:scale-105">
                START NOW
            </a>
            <button class="bg-white/5 hover:bg-white/10 text-white px-8 py-4 rounded-full font-bold text-lg border border-white/10 transition">
                WATCH DEMO
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 mt-10">
        <div class="relative rounded-3xl border border-white/10 overflow-hidden shadow-2xl glass-card">
            <img src="hero.png" alt="Dashboard Preview" class="w-full h-auto block">
        </div>
    </div>

    <footer class="mt-20 py-10 border-t border-white/5 text-center text-gray-500 text-sm">
        © 2026 ActivityMetrics. All rights reserved.
    </footer>
</body>
</html>
